name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: arandue_test
          POSTGRES_USER: arandue
          POSTGRES_PASSWORD: arandue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arandue -d arandue_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://arandue:arandue@127.0.0.1:5432/arandue_test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Só o navegador: a imagem ubuntu-latest já traz as bibliotecas do Chromium.
      # Sem `install-deps`, porque o apt do runner fica sem DNS e travava o job
      # antes de o e2e terminar.
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
      - run: npm run build
      - run: npm run test:pacote
      - run: npm audit --omit=dev --audit-level=high
